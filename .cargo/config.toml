# ========== 环境变量 ==========
[env]
# 覆盖率 *.profraw 收集到 target/profraw/（覆盖用户级 /tmp 默认值）。
# cargo test 直接生效；cargo tarpaulin 需通过 shell 环境变量手动传入。
LLVM_PROFILE_FILE = { value = "target/profraw/%p-%m.profraw", relative = true }

# ========== 网络 ==========
[net]
# 使用系统 git 克隆依赖，充分利用 git 代理/镜像配置
git-fetch-with-cli = true

# ========== 编译构建 ==========
[build]
# 增量编译
incremental = true
# 全局 rustflags：对所有 target 和 profile 生效
rustflags = [
    # v0 符号修饰：更小、确定性、利于 LTO
    "-C", "symbol-mangling-version=v0",
]

# ========== 编译优化配置 ==========

[profile.release]
opt-level = "z"          # 更激进 size 优化（毫秒级 CLI 无性能热路径）
strip = true             # 去除调试符号
debug = false            # 不生成 debug 信息（如需堆栈回溯改为 "limited"）
lto = true               # 链接时优化
codegen-units = 1        # 单代码生成单元，最大化优化
panic = "abort"          # panic 直接 abort，不生成 unwinding 代码
incremental = false      # release 关增量（增量会降低优化质量、拖慢构建；dev/test 不受影响）

[profile.dev]
opt-level = 0            # 快速编译
debug = true             # 保留调试信息
strip = false            # 保留符号

[profile.test]
opt-level = 0
debug = true
strip = false
