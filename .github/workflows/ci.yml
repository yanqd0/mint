# CI 门禁：fmt/clippy/test（三平台）/coverage。push master + PR 触发，不发布。
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 覆盖率棘轮：只升不降（当前 92.28%，阈值 90 达标）。提升后手动上调此处。
  FAIL_UNDER_LINES: "90"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .cargo/config.local.toml 不随仓库分发；CI 用默认链接器（无 mold 依赖）
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # 文件行数门禁：src/ tests/ 下 .rs 一律 ≤300 行（src/AGENTS.md 提交前检查清单）。
  filesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .rs file length (max 300 lines)
        run: |
          over="$(find src tests -name '*.rs' -print0 | xargs -0 wc -l \
            | awk '$1 > 300 && $2 != "total" { print $1 " " $2 }' | sort -rn)"
          if [ -n "$over" ]; then
            echo "::error::found .rs files over 300 lines:"
            printf '%s\n' "$over"
            exit 1
          fi

  # npm 安装器门禁（#504）：发布时会用 scripts/npm/patch-installer.mjs 重写
  # cargo-dist 生成的 launcher；这里守住锚点契约与「锁 + 暂存 + 原子 rename」语义。
  npm-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: node --test scripts/npm/*.test.mjs

  # 发布脚本门禁（#506）：release-gate 判定矩阵 + 发布 workflow 不变式/YAML 语法。
  # 判定语义只在 scripts/release-gate.sh 一处实现；workflow 里的内联判定由不变式拦住。
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release-gate tests
        run: bash scripts/release-gate.test.sh
      - name: workflow invariants + YAML syntax
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml
          "$RUNNER_TEMP/venv/bin/python" scripts/check-workflows.py

  # 依赖治理门禁：CVE(advisories) + license + 版本漂移(bans) + 来源(sources)。
  # deny.toml 为权威配置；advisories 数据由 action 缓存（与本地 cargo audit 同源 RustSec）。
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: embarkstudios/cargo-deny-action@v2
        with:
          command: check

  # headless 门禁：--no-default-features 必须可编译（TUI feature-gating 后）
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines ${{ env.FAIL_UNDER_LINES }}
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          # coverage 门禁由 `--fail-under-lines` 严格执行；上传失败（如 token 未配）不阻塞 CI
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
