# PyPI 发布：由 Release workflow 成功后串联触发（#505）；判定（tag==版本 + stable/预发布）
# 唯一实现是 scripts/release-gate.sh。
# maturin bindings=bin 壳；Linux wheel 用 musl 静态链接。
# 受保护 environment `pypi` + OIDC trusted publishing（免 token）。
name: Publish PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. 0.9.0); must match Cargo.toml"
        required: true

permissions:
  id-token: write   # OIDC 可信发布
  contents: read

jobs:
  gate:
    # 只认 tag 触发的 Release 且必须成功（#505：Release/npm 缺失时 registry 零发布）；
    # 手工入口由 dispatch 提供显式 tag（#510）。
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      # workflow_run 的执行 ref 是默认分支，发布身份由 checkout 的提交（tag 提交）决定
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}   # 经 env 传递，避免表达式注入
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            # 不依赖事件负载字段：直接取落在 HEAD 上的同版本 tag
            VERSION="$(scripts/release-gate.sh --print version)"
            TAG="$(git tag --points-at HEAD | grep -x -e "$VERSION" -e "v$VERSION" | head -n1)"
            if [ -z "$TAG" ]; then
              echo "::error::no tag matching Cargo.toml $VERSION at HEAD"
              exit 1
            fi
          fi
          scripts/release-gate.sh --tag "$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.is_stable == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }  # Linux musl 静态
          - { os: macos-latest,  target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: gate
    if: needs.gate.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    needs: [gate, build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 幂等化（#507）：同版本文件已存在视为成功，重跑发布链路不会失败
          skip-existing: true
