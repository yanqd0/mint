# PyPI 发布：tag vX.Y.Z 激活；gate 判定 stable（-alpha/-beta 跳过）。
# maturin bindings=bin 壳；Linux wheel 用 musl 静态链接。
# 受保护 environment `pypi` + OIDC trusted publishing（免 token）。
name: Publish PyPI

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 可信发布
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag($TAG) != Cargo.toml($VERSION)"; exit 1
          fi
          case "$VERSION" in
            *-*) echo "is_stable=false" >> $GITHUB_OUTPUT ;;
            *)   echo "is_stable=true" >> $GITHUB_OUTPUT ;;
          esac

  build:
    needs: gate
    if: needs.gate.outputs.is_stable == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }  # Linux musl 静态
          - { os: macos-latest,  target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: gate
    if: needs.gate.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [gate, build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
