# crates.io 发布：tag vX.Y.Z 激活；判定（tag==版本 + stable/预发布）唯一实现是 scripts/release-gate.sh。
# 受保护 environment `crates-io`（放 CARGO_REGISTRY_TOKEN + Required reviewers 审批）。
name: Publish crates.io

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: scripts/release-gate.sh >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 幂等化（#507）：同一 tag 重跑时不因「版本已存在」失败
      - name: Publish (skip if already on crates.io)
        run: |
          if scripts/is-published.sh crates-io "$VERSION"; then
            echo "mint-faa $VERSION is already on crates.io — skipping publish"
          else
            cargo publish --locked
          fi
