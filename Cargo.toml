[package]
name = "mint-faa"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Minimal Issue & Needs Tracker — global SQLite issue system for AI agents"
authors = ["Yan QiDong"]
repository = "https://github.com/yanqd0/mint"
readme = "README.md"
rust-version = "1.88"
keywords = ["issue-tracker", "sqlite", "cli", "tui", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**"]

[[bin]]
name = "mint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
whoami = "1"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rstest = "0.26"
tempfile = "3"

# cargo-dist 发布构建 profile（Release workflow 用 `cargo build --profile dist`）。
[profile.dist]
inherits = "release"
lto = "thin"
