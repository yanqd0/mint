[package]
name = "mint-faa"
version = "0.5.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Minimal Issue & Needs Tracker — global SQLite issue system for AI agents"

[[bin]]
name = "mint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
whoami = "1"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rstest = "0.26"
tempfile = "3"
