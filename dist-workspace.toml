[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["npm"]
# Which installers to run during 'dist publish'
publish-jobs = ["npm"]
# npm package name (crates.io/PyPI 统一 mint-faa；`mint` 已被占)
npm-package = "mint-faa"
# 允许手改生成的 release.yml（npm OIDC trusted publishing 需加 --provenance + id-token: write）
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
# Linux 走 musl 静态链接（单文件免依赖）；macOS/Windows 默认
# #349：+aarch64-unknown-linux-musl（Linux ARM64）、+aarch64-pc-windows-msvc（Windows ARM64）
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# System packages to install on CI builders (musl-gcc for musl static linking)
[dist.dependencies.apt]
musl-tools = "*"

# Windows ARM64 交叉编译：Linux runner 上经 cargo-xwin 容器构建（#349）
[dist.github-custom-runners]
aarch64-pc-windows-msvc.container = "messense/cargo-xwin"
